site_name: ESP32-C3 Filter Wheel Controller
site_description: Open-source astronomy filter wheel controller with ASCOM compatibility
site_author: Juan José López
site_url: https://juanjol.github.io/autoFilterWheel/

repo_name: autoFilterWheel
repo_url: https://github.com/juanjol/autoFilterWheel

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Hardware Requirements: getting-started/hardware.md
    - Assembly Guide: getting-started/assembly-uln2003.md
  - Reference:
    - Commands: https://github.com/juanjol/autoFilterWheel/blob/main/COMMANDS.md
    - ASCOM Protocol: https://github.com/juanjol/autoFilterWheel/blob/main/ASCOM_PROTOCOL.md
